name: DB CD — Continuous Delivery

on:
  # The manager requested Continuous Delivery rather than Continuous Deployment.
  # This pipeline is triggered manually by an authorized user.
  workflow_dispatch:

concurrency:
  group: db-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLYWAY_IMAGE: "flyway/flyway:12.6.0"
  FLYWAY_URL: ${{ secrets.FLYWAY_URL }}
  FLYWAY_USER: ${{ secrets.FLYWAY_USER }}
  FLYWAY_PASSWORD: ${{ secrets.FLYWAY_PASSWORD }}

jobs:
  migrate-production:
    name: "Flyway Migrate Production"
    runs-on: ubuntu-latest

    environment:
      name: production

    defaults:
      run:
        working-directory: db

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Normalize JDBC URL
        run: |
          RAW="$FLYWAY_URL"
          if [[ "$RAW" == postgresql://* ]]; then
            JDBC_URL="jdbc:${RAW}"
          elif [[ "$RAW" == postgres://* ]]; then
            JDBC_URL="jdbc:postgresql://${RAW#postgres://}"
          else
            JDBC_URL="$RAW"
          fi
          JDBC_URL="${JDBC_URL//&channel_binding=require/}"
          JDBC_URL="${JDBC_URL//\?channel_binding=require/}"
          echo "::add-mask::$JDBC_URL"
          echo "JDBC_URL=$JDBC_URL" >> "$GITHUB_ENV"

      - name: Flyway info — pending migrations preview
        run: |
          echo "--- State BEFORE Migration ---" > flyway-cd-report.txt
          docker run --rm \
            -v "$(pwd)/migrations:/flyway/migrations" \
            -e FLYWAY_URL="$JDBC_URL" \
            -e FLYWAY_USER="$FLYWAY_USER" \
            -e FLYWAY_PASSWORD="$FLYWAY_PASSWORD" \
            ${{ env.FLYWAY_IMAGE }} \
            -connectRetries=3 \
            info | tee -a flyway-cd-report.txt

      - name: Flyway migrate
        run: |
          echo -e "\n--- Migration Execution Logs ---" >> flyway-cd-report.txt
          docker run --rm \
            -v "$(pwd)/migrations:/flyway/migrations" \
            -e FLYWAY_URL="$JDBC_URL" \
            -e FLYWAY_USER="$FLYWAY_USER" \
            -e FLYWAY_PASSWORD="$FLYWAY_PASSWORD" \
            ${{ env.FLYWAY_IMAGE }} \
            -outOfOrder=false \
            -validateOnMigrate=true \
            -connectRetries=3 \
            migrate | tee -a flyway-cd-report.txt

      - name: Flyway info — post-migration state
        if: always()
        run: |
          echo -e "\n--- State AFTER Migration ---" >> flyway-cd-report.txt
          docker run --rm \
            -v "$(pwd)/migrations:/flyway/migrations" \
            -e FLYWAY_URL="$JDBC_URL" \
            -e FLYWAY_USER="$FLYWAY_USER" \
            -e FLYWAY_PASSWORD="$FLYWAY_PASSWORD" \
            ${{ env.FLYWAY_IMAGE }} \
            -connectRetries=3 \
            info | tee -a flyway-cd-report.txt

      - name: Upload CD Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flyway-deployment-report
          path: db/flyway-cd-report.txt

  notify-on-failure:
    name: "Failure Notification"
    runs-on: ubuntu-latest
    needs: [migrate-production]
    if: failure()

    steps:
      - name: Report failure details
        run: |
          echo "============================================"
          echo "  DB Release CD Pipeline FAILED" 
          echo "============================================"
          echo "  Branch  : ${{ github.ref_name }}"
          echo "  Actor   : ${{ github.actor }}"
          echo "  Commit  : ${{ github.sha }}"
          echo "  Run URL : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "============================================"
