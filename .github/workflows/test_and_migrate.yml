name: DB Release — Test and Migrate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: db-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLYWAY_IMAGE: "flyway/flyway:12.6.0"

jobs:

  lint-migrations:
    name: "Lint & Scan SQL Migrations"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}

      - name: Install sqlfluff
        run: pip install sqlfluff --quiet

      - name: Lint SQL migration files
        run: |
          sqlfluff lint db/migrations/ \
            --dialect postgres \
            --templater raw \
            --format github-annotation \
            --annotation-level warning \
            || true

  validate-migrations:
    name: "Flyway Validate"
    runs-on: ubuntu-latest
    needs: lint-migrations

    defaults:
      run:
        working-directory: db

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Flyway validate
        run: |
          docker run --rm \
            -v "$(pwd)/migrations:/flyway/migrations" \
            -e FLYWAY_URL="${{ secrets.FLYWAY_URL }}" \
            -e FLYWAY_USER="${{ secrets.FLYWAY_USER }}" \
            -e FLYWAY_PASSWORD="${{ secrets.FLYWAY_PASSWORD }}" \
            ${{ env.FLYWAY_IMAGE }} \
            validate 

  migrate-production: 
    name: "Flyway Migrate Production"
    runs-on: ubuntu-latest
    needs: validate-migrations

    # Only run on actual push to main — never on pull requests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    environment:
      name: production

    defaults:
      run:
        working-directory: db

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Flyway info — pending migrations preview
        run: |
          docker run --rm \
            -v "$(pwd)/migrations:/flyway/migrations" \
            -e FLYWAY_URL="${{ secrets.FLYWAY_URL }}" \
            -e FLYWAY_USER="${{ secrets.FLYWAY_USER }}" \
            -e FLYWAY_PASSWORD="${{ secrets.FLYWAY_PASSWORD }}" \
            ${{ env.FLYWAY_IMAGE }} \
            info

      - name: Flyway migrate
        run: |
          docker run --rm \
            -v "$(pwd)/migrations:/flyway/migrations" \
            -e FLYWAY_URL="$JDBC_URL" \
            -e FLYWAY_USER="${{ secrets.FLYWAY_USER }}" \
            -e FLYWAY_PASSWORD="${{ secrets.FLYWAY_PASSWORD }}" \
            ${{ env.FLYWAY_IMAGE }} \
            -validateOnMigrate=true \
            migrate

      - name: Flyway info — post-migration state
        run: |
          docker run --rm \
            -v "$(pwd)/migrations:/flyway/migrations" \
            -e FLYWAY_URL="${{ secrets.FLYWAY_URL }}" \
            -e FLYWAY_USER="${{ secrets.FLYWAY_USER }}" \
            -e FLYWAY_PASSWORD="${{ secrets.FLYWAY_PASSWORD }}" \
            ${{ env.FLYWAY_IMAGE }} \
            info

  notify-on-failure:
    name: "Failure Notification"
    runs-on: ubuntu-latest
    needs: [lint-migrations, validate-migrations, migrate-production]
    if: failure()

    steps:
      - name: Report failure details
        run: |
          echo "============================================"
          echo "  DB Release Pipeline FAILED" 
          echo "============================================"
          echo "  Branch  : ${{ github.ref_name }}"
          echo "  Actor   : ${{ github.actor }}"
          echo "  Commit  : ${{ github.sha }}"
          echo "  Run URL : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "============================================"