name: DB Release — Test and Migrate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: db-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLYWAY_IMAGE: "flyway/flyway:latest"
  FLYWAY_URL: ${{ secrets.FLYWAY_URL }}
  FLYWAY_USER: ${{ secrets.FLYWAY_USER }}
  FLYWAY_PASSWORD: ${{ secrets.FLYWAY_PASSWORD }}

jobs:

  lint-migrations:
    name: "Lint & Scan SQL Migrations"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # - name: Secret scan — migration files
      #   uses: trufflesecurity/trufflehog-actions-scan@v3.82.10
      #   with:
      #     path: ./db/migrations
      #     base: ${{ github.event.repository.default_branch }}
      #     head: HEAD

      - name: Install sqlfluff
        run: pip install sqlfluff --quiet

      - name: Lint SQL migration files
        run: |
          sqlfluff lint db/migrations/ \
            --dialect postgres \
            --templater raw \
            --format github-annotation \
            --annotation-level warning \
            || true

  validate-migrations:
    name: "Flyway Validate"
    runs-on: ubuntu-latest
    needs: lint-migrations

    defaults:
      run:
        working-directory: db

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Neon (and many providers) give connection strings in postgresql:// format.
      # Flyway requires the jdbc:postgresql:// prefix — normalize it here.
      - name: Normalize JDBC URL
        run: |
          RAW="${{ secrets.FLYWAY_URL }}"
          if [[ "$RAW" == postgresql://* ]]; then
            JDBC_URL="jdbc:${RAW}"
          elif [[ "$RAW" == postgres://* ]]; then
            JDBC_URL="jdbc:postgresql://${RAW#postgres://}"
          else
            JDBC_URL="$RAW"
          fi
          echo "::add-mask::$JDBC_URL"
          echo "JDBC_URL=$JDBC_URL" >> "$GITHUB_ENV"

      - name: Flyway validate
        run: |
          docker run --rm \
            -v "$(pwd)/migrations:/flyway/migrations" \
            -e FLYWAY_URL="$JDBC_URL" \
            -e FLYWAY_USER="${{ secrets.FLYWAY_USER }}" \
            -e FLYWAY_PASSWORD="${{ secrets.FLYWAY_PASSWORD }}" \
            ${{ env.FLYWAY_IMAGE }} \
            -outOfOrder=false \
            -connectRetries=3 \
            validate 

  migrate-production:
    name: "Flyway Migrate Production"
    runs-on: ubuntu-latest
    needs: validate-migrations

    # Only run on actual push to main — never on pull requests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    environment:
      name: production

    defaults:
      run:
        working-directory: db

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Normalize JDBC URL
        run: |
          RAW="${{ secrets.FLYWAY_URL }}"
          if [[ "$RAW" == postgresql://* ]]; then
            JDBC_URL="jdbc:${RAW}"
          elif [[ "$RAW" == postgres://* ]]; then
            JDBC_URL="jdbc:postgresql://${RAW#postgres://}"
          else
            JDBC_URL="$RAW"
          fi
          echo "::add-mask::$JDBC_URL"
          echo "JDBC_URL=$JDBC_URL" >> "$GITHUB_ENV"

      - name: Flyway info — pending migrations preview
        run: |
          docker run --rm \
            -v "$(pwd)/migrations:/flyway/migrations" \
            -e FLYWAY_URL="$JDBC_URL" \
            -e FLYWAY_USER="${{ secrets.FLYWAY_USER }}" \
            -e FLYWAY_PASSWORD="${{ secrets.FLYWAY_PASSWORD }}" \
            ${{ env.FLYWAY_IMAGE }} \
            -connectRetries=3 \
            info

      - name: Flyway migrate
        run: |
          docker run --rm \
            -v "$(pwd)/migrations:/flyway/migrations" \
            -e FLYWAY_URL="$JDBC_URL" \
            -e FLYWAY_USER="${{ secrets.FLYWAY_USER }}" \
            -e FLYWAY_PASSWORD="${{ secrets.FLYWAY_PASSWORD }}" \
            ${{ env.FLYWAY_IMAGE }} \
            -outOfOrder=false \
            -validateOnMigrate=true \
            -connectRetries=3 \
            migrate

      - name: Flyway info — post-migration state
        if: always()
        run: |
          docker run --rm \
            -v "$(pwd)/migrations:/flyway/migrations" \
            -e FLYWAY_URL="$JDBC_URL" \
            -e FLYWAY_USER="${{ secrets.FLYWAY_USER }}" \
            -e FLYWAY_PASSWORD="${{ secrets.FLYWAY_PASSWORD }}" \
            ${{ env.FLYWAY_IMAGE }} \
            -connectRetries=3 \
            info

  notify-on-failure:
    name: "Failure Notification"
    runs-on: ubuntu-latest
    needs: [lint-migrations, validate-migrations, migrate-production]
    if: failure()

    steps:
      - name: Report failure details
        run: |
          echo "============================================"
          echo "  DB Release Pipeline FAILED" 
          echo "============================================"
          echo "  Branch  : ${{ github.ref_name }}"
          echo "  Actor   : ${{ github.actor }}"
          echo "  Commit  : ${{ github.sha }}"
          echo "  Run URL : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "============================================"
