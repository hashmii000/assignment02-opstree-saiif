name: DB CI Validation & Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: db-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-scan:
    name: Lint & Scan SQL Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

      - name: Install SQLFluff
        run: |
          python -m pip install --upgrade pip
          pip install sqlfluff

      - name: Lint SQL Migration Files
        run: |
          sqlfluff lint db/migrations \
            --dialect postgres \
            --format human > sql-lint-report.txt || true

      - name: Validate Migration Naming
        run: |
          for file in db/migrations/*.sql; do
            filename=$(basename "$file")
            if ! [[ $filename =~ ^V[0-9]+__.*\.sql$ ]]; then
              echo "Invalid migration name: $filename"
              exit 1
            fi
          done

      - name: Upload SQLFluff Report
        uses: actions/upload-artifact@v4
        with:
          name: sql-lint-report
          path: sql-lint-report.txt

  validate-migrations:
    name: Flyway Validate
    runs-on: ubuntu-latest
    needs: lint-and-scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Flyway Info
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/db/migrations:/flyway/sql" \
            -e FLYWAY_URL="${{ secrets.FLYWAY_URL }}" \
            -e FLYWAY_USER="${{ secrets.FLYWAY_USER }}" \
            -e FLYWAY_PASSWORD="${{ secrets.FLYWAY_PASSWORD }}" \
            redgate/flyway:latest \
            info

      - name: Flyway Validate
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/db/migrations:/flyway/sql" \
            -e FLYWAY_URL="${{ secrets.FLYWAY_URL }}" \
            -e FLYWAY_USER="${{ secrets.FLYWAY_USER }}" \
            -e FLYWAY_PASSWORD="${{ secrets.FLYWAY_PASSWORD }}" \
            redgate/flyway:latest \
            validate | tee flyway-validate-report.txt

      - name: Upload Flyway Validation Report
        uses: actions/upload-artifact@v4
        with:
          name: flyway-validate-report
          path: flyway-validate-report.txt
