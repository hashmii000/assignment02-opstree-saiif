name: DB CI Validation & Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: db-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLYWAY_IMAGE: "flyway/flyway:12.6.0"
  FLYWAY_URL: ${{ secrets.FLYWAY_URL }}
  FLYWAY_USER: ${{ secrets.FLYWAY_USER }}
  FLYWAY_PASSWORD: ${{ secrets.FLYWAY_PASSWORD }}

jobs:
  lint-and-scan:
    name: "Lint & Scan SQL Migrations"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}

      - name: Install sqlfluff
        run: pip install sqlfluff --quiet

      - name: Lint SQL migration files & Generate Report
        run: |
          sqlfluff lint db/migrations/ \
            --dialect postgres \
            --format human > sql-lint-report.txt || true

          sqlfluff lint db/migrations/ \
            --dialect postgres \
            --format github-annotation \
            --annotation-level warning || true

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        with:
          name: sql-lint-report
          path: sql-lint-report.txt

  validate-migrations:
    name: "Flyway Validate"
    runs-on: ubuntu-latest
    needs: lint-and-scan

    defaults:
      run:
        working-directory: db

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Flyway validate
        run: |
          # Redirecting output to both console and a report file
          docker run --rm \
            -v "$(pwd)/migrations:/flyway/migrations" \
            -e FLYWAY_URL="${{secrets.FLYWAY_URL}}" \
            -e FLYWAY_USER="$FLYWAY_USER" \
            -e FLYWAY_PASSWORD="$FLYWAY_PASSWORD" \
            ${{ env.FLYWAY_IMAGE }} \
            validate | tee flyway-validate-report.txt

      - name: Upload Validate Report
        uses: actions/upload-artifact@v4
        with:
          name: flyway-validate-report
          path: db/flyway-validate-report.txt
