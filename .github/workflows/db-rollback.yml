name: DB Rollback — Manual Trigger

# ─────────────────────────────────────────────────────────────
# This workflow is MANUAL ONLY.
# It is never triggered automatically by a push or PR.
#
# When to use:
#   A migration has been applied to production and needs to be
#   reversed. The engineer must first commit a rollback migration
#   script to the repo (e.g. V3__rollback_phone_column.sql),
#   then trigger this workflow to apply it.
#
# IMPORTANT:
#   Flyway community edition does not support automatic undo.
#   The forward-rollback pattern is used here:
#     → Write a new migration that reverses the previous change
#     → Trigger this workflow to apply it
#     → The database state is corrected without losing history
# ─────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for rollback (shown in audit log)"
        required: true
        type: string
      migration_version:
        description: "Migration version being rolled back (e.g. V2)"
        required: true
        type: string
      confirmed:
        description: "Type CONFIRM to proceed (safety gate)"
        required: true
        type: string

concurrency:
  group: db-rollback-production
  cancel-in-progress: false     # Never kill an in-flight rollback

permissions:
  contents: read

env:
  FLYWAY_IMAGE: "flyway/flyway:12.6.0"
  FLYWAY_URL: ${{ secrets.FLYWAY_URL }}
  FLYWAY_USER: ${{ secrets.FLYWAY_USER }}
  FLYWAY_PASSWORD: ${{ secrets.FLYWAY_PASSWORD }}

jobs:

  # ═══════════════════════════════════════════
  # Safety check — abort if confirmation is wrong
  # ═══════════════════════════════════════════
  confirm-rollback:
    name: "🔒 Confirm Rollback Intent"
    runs-on: ubuntu-latest

    steps:
      - name: Verify confirmation input
        run: |
          echo "============================================"
          echo "  DB ROLLBACK INITIATED"
          echo "============================================"
          echo "  Triggered by : ${{ github.actor }}"
          echo "  Reason       : ${{ inputs.reason }}"
          echo "  Rolling back : ${{ inputs.migration_version }}"
          echo "  Run URL      : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "============================================"

          if [[ "${{ inputs.confirmed }}" != "CONFIRM" ]]; then
            echo ""
            echo "❌ Confirmation not received. You must type CONFIRM to proceed."
            echo "   Aborting rollback."
            exit 1
          fi

          echo "✅ Confirmation received. Proceeding with rollback."

  # ═══════════════════════════════════════════
  # Apply the rollback migration
  # ═══════════════════════════════════════════
  rollback-production:
    name: "⏪ Apply Rollback Migration"
    runs-on: ubuntu-latest
    needs: confirm-rollback

    environment:
      name: production

    defaults:
      run:
        working-directory: db

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Normalize JDBC URL
        run: |
          RAW="$FLYWAY_URL"
          if [[ "$RAW" == postgresql://* ]]; then
            JDBC_URL="jdbc:${RAW}"
          elif [[ "$RAW" == postgres://* ]]; then
            JDBC_URL="jdbc:postgresql://${RAW#postgres://}"
          else
            JDBC_URL="$RAW"
          fi
          JDBC_URL="${JDBC_URL//&channel_binding=require/}"
          JDBC_URL="${JDBC_URL//\?channel_binding=require/}"
          echo "::add-mask::$JDBC_URL"
          echo "JDBC_URL=$JDBC_URL" >> "$GITHUB_ENV"

      - name: Flyway info — current state before rollback
        run: |
          echo "--- Schema state BEFORE rollback ---" > flyway-rollback-report.txt
          docker run --rm \
            -v "$(pwd)/migrations:/flyway/migrations" \
            -e FLYWAY_URL="$JDBC_URL" \
            -e FLYWAY_USER="$FLYWAY_USER" \
            -e FLYWAY_PASSWORD="$FLYWAY_PASSWORD" \
            ${{ env.FLYWAY_IMAGE }} \
            -connectRetries=3 \
            info | tee -a flyway-rollback-report.txt

      - name: Flyway migrate — apply rollback script
        run: |
          echo -e "\n--- Applying rollback migration for ${{ inputs.migration_version }} ---" >> flyway-rollback-report.txt
          echo "--- Reason: ${{ inputs.reason }} ---" >> flyway-rollback-report.txt
          docker run --rm \
            -v "$(pwd)/migrations:/flyway/migrations" \
            -e FLYWAY_URL="$JDBC_URL" \
            -e FLYWAY_USER="$FLYWAY_USER" \
            -e FLYWAY_PASSWORD="$FLYWAY_PASSWORD" \
            ${{ env.FLYWAY_IMAGE }} \
            -outOfOrder=false \
            -validateOnMigrate=true \
            -connectRetries=3 \
            migrate | tee -a flyway-rollback-report.txt

      - name: Flyway info — final state after rollback
        if: always()
        run: |
          echo -e "\n--- Schema state AFTER rollback ---" >> flyway-rollback-report.txt
          docker run --rm \
            -v "$(pwd)/migrations:/flyway/migrations" \
            -e FLYWAY_URL="$JDBC_URL" \
            -e FLYWAY_USER="$FLYWAY_USER" \
            -e FLYWAY_PASSWORD="$FLYWAY_PASSWORD" \
            ${{ env.FLYWAY_IMAGE }} \
            -connectRetries=3 \
            info | tee -a flyway-rollback-report.txt

      - name: Rollback audit log
        if: always()
        run: |
          echo "============================================"
          echo "  ROLLBACK AUDIT RECORD"
          echo "============================================"
          echo "  Actor    : ${{ github.actor }}"
          echo "  Reason   : ${{ inputs.reason }}"
          echo "  Target   : ${{ inputs.migration_version }}"
          echo "  Status   : ${{ job.status }}"
          echo "  Time     : $(date -u)"
          echo "  Run URL  : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "============================================"

      - name: Upload Rollback Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flyway-rollback-report
          path: db/flyway-rollback-report.txt
